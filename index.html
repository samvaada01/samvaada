    <style>
      /* Painted straight from the HTML, so the page is never a blank white
         rectangle while the bundles download. Deliberately a pixel match for
         <Loading /> (the spinning aperture) so when React mounts and takes
         over, the handoff is invisible — same mark, same label, same colours. */
      html,
      body {
        margin: 0;
        background: #06090c;
        color: #c4d4e1;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #06090c;
      }
      .boot svg {
        width: 64px;
        height: 64px;
        animation: boot-aperture 3s linear infinite;
      }
      .boot span {
        font-family: "Manrope", system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.72rem;
        font-weight: 600;
        color: #89a3b6;
      }
      @keyframes boot-aperture {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <svg viewBox="0 0 100 100" fill="none" stroke-width="2" stroke-linecap="round">

          </g>
        </svg>
        <span>Focusing&hellip;</span>
      </div>
    </div>
